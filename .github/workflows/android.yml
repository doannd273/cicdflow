name: Android learning CI/CD

on:
  pull_request:
  push:
    branches:
      - develop
      - 'qc/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # setup gradle
      - name: Grant permission
        run: chmod +x gradlew

      # lint
      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

      # test
      - name: Run Unit Test
        run: ./gradlew test

      # luôn build để check
      - name: Build Dev Debug
        run: ./gradlew assembleDevDebug

      # upload firebase
      - name: Upload Firebase
        if: |
          github.event_name == 'push' && 
          (
          startsWith(github.ref, 'refs/heads/qc/') ||
          github.ref == 'refs/heads/develop'
          )
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./gradlew appDistributionUploadDevDebug

