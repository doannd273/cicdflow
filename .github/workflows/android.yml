name: Android learning CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - develop
job:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkouts@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

